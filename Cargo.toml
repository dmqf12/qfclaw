[package]
name = "qfclaw"
version = "0.1.0"
edition = "2024"


[[bin]]
path = "main.rs"
name = "qfclaw"

[workspace]
members = ["lib/command", "lib/aichat", "lib/sendmsg"]


[dependencies]
aichat = { path = "lib/aichat" }
command = { path = "lib/command" }
sendmsg = { path = "lib/sendmsg" }

serde_json = "1.0"
axum = "0.8.9"
constant_time_eq = "0.5.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.13.3", features = ["native-tls", "json"], default-features = false }


[workspace.dependencies]
reqwest = { version = "0.13.3", features = ["stream","json"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
anyhow = "1.0"
