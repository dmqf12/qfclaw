[package]
name = "qfclaw"
version = "0.1.0"
edition = "2024"


[dependencies]

serde_json = "1.0"
axum = "0.8.9"
constant_time_eq = "0.5.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
reqwest = { version = "0.13.3", features = ["stream", "native-tls", "json"], default-features = false }
anyhow = "1.0"
uuid = { version = "1.23.1", features = ["v4"] }
lazy_static = "1.5.0"
once_cell = "1.19"
regex = "1"
futures = "0.3"
rand = "0.10.1"
chrono = "0.4"
