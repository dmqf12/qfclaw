[package]
name = "qfclaw"
version = "1.0.0"
edition = "2024"


[dependencies]
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.3", features = ["rustls", "json", "multipart"], default-features = false }
anyhow = "1.0"
once_cell = "1.19"
regex = "1"
sha2 = "0.10"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
fastrand = "2.5.0"
